server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes are served by the React entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health endpoint; no application secrets or dependencies exposed.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Avoid caching the HTML shell so new deployments take effect promptly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite assets are content-hashed and safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
