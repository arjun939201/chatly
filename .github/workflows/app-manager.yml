name: App Manager CI

on:
  push:
    branches: [main]
    paths:
      - "app-manager/**"
      - ".github/workflows/app-manager.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-manager/**"
      - ".github/workflows/app-manager.yml"

permissions:
  contents: read

concurrency:
  group: app-manager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: App Manager tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
