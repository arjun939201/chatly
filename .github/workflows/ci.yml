name: Chatly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid wasting runner time on superseded pushes to the same branch.
concurrency:
  group: chatly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Build application
        run: npm run build

  container-build:
    timeout-minutes: 15
    name: Docker production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: chatly:ci
