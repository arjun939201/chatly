name: Chatly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid wasting runner time on superseded pushes to the same branch.
concurrency:
  group: chatly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Run regression tests
        run: npm test
